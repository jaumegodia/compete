name: Share of voice (anuncios en Google)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = guarda respuestas crudas de unas búsquedas (artefacto), sin base de datos'
        type: choice
        options: [probe]
        default: probe
      keywords:
        description: 'Búsquedas para la sonda, separadas por |'
        required: false
        default: 'colchón 150x190|colchón viscoelástico|comprar colchón'

jobs:
  sov:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sonda
        if: inputs.mode == 'probe'
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          KEYWORDS: ${{ inputs.keywords }}
        run: |
          IFS='|' read -ra KW <<< "$KEYWORDS"
          npx tsx scrapers/src/sov-probe.ts "${KW[@]}"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('out/**') != ''
        with:
          name: sov
          path: out/
          retention-days: 7

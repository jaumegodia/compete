name: Captura diaria de catálogos

on:
  schedule:
    - cron: '17 4 * * *' # cada día a las 04:17 UTC (05:17 en Madrid en invierno)
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = guarda en Supabase · dry = solo prueba, sin base de datos'
        type: choice
        options: [full, dry]
        default: full
      site:
        description: 'Filtrar por texto de la URL (vacío = todas). En modo dry, URLs separadas por espacios.'
        required: false
        default: ''

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Captura (guarda en Supabase)
        if: github.event_name == 'schedule' || inputs.mode == 'full'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE: ${{ inputs.site }}
        run: |
          if [ -n "$SITE" ]; then npm run scrape -- --site "$SITE"; else npm run scrape; fi

      - name: Prueba sin base de datos
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry'
        env:
          SITES: ${{ inputs.site || 'https://comounamarmota.com https://www.emma-colchon.es https://www.dormideo.com' }}
          MAX_PRODUCTS: '300'
        run: |
          for url in $SITES; do
            npm run scrape:dry -- --url "$url" || echo "::warning::Fallo en $url"
          done

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('out/**') != ''
        with:
          name: capturas
          path: out/
          retention-days: 7

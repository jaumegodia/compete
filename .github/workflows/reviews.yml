name: Reseñas (Trustpilot vía DataForSEO)

on:
  schedule:
    - cron: '41 5 * * 1' # cada lunes a las 05:41 UTC
  workflow_dispatch:
    inputs:
      site:
        description: 'Filtrar por texto de la URL (vacío = todas las webs activas)'
        required: false
        default: ''
      depth:
        description: 'Reseñas más recientes por web (se cobra por cada 20)'
        required: false
        default: '100'
      dry:
        description: 'Solo prueba: llama a la API pero no guarda en Supabase'
        type: boolean
        default: false

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Nota global y últimas reseñas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          SITE: ${{ inputs.site }}
          REVIEWS_DEPTH: ${{ inputs.depth || '100' }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then npm run reviews:dry; else npm run reviews; fi

name: Publicidad (Google Ads Transparency)

on:
  schedule:
    - cron: '11 6 * * *' # cada día a las 06:11 UTC
  workflow_dispatch:
    inputs:
      site:
        description: 'Filtrar por texto de la URL (vacío = todas las webs activas)'
        required: false
        default: ''
      dry:
        description: 'Solo prueba: llama a la API pero no guarda en Supabase'
        type: boolean
        default: false

concurrency:
  group: ads
  cancel-in-progress: false

jobs:
  ads:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Anuncios de cada marca
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          SITE: ${{ inputs.site }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then npm run ads:dry; else npm run ads; fi
